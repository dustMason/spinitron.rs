name: Daily Playlist Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      auth_check_only:
        description: 'Only verify Spotify authentication'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: spinitron-catalog
  cancel-in-progress: false

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The daily scraper and site build do not use the macOS companion.
          sparse-checkout: |
            /*
            !/companion/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            cache
            spotify_cache/track_cache.json
          key: ${{ runner.os }}-track-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-track-cache-v2-
      - name: Build and test
        id: build
        run: |
          python3 -m unittest discover -s scripts -p 'test_file_spotify_playlists.py'
          cargo test --locked
          cargo build --release --locked
      - name: Check Spotify authentication
        if: ${{ inputs.auth_check_only }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: ./target/release/spinitron-scraper --check-spotify-auth
      - name: Archive completed broadcasts
        id: archive
        if: ${{ !inputs.auth_check_only }}
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: ./target/release/spinitron-scraper --archive
      - name: Restore Spotify folder cooldown
        if: ${{ !cancelled() && !inputs.auth_check_only && steps.build.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: spotify_cache/folder-cooldown.json
          key: ${{ runner.os }}-spotify-folder-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-spotify-folder-cooldown-
      - name: File saved catalog playlists in KALX
        id: folders
        timeout-minutes: 10
        if: ${{ !cancelled() && !inputs.auth_check_only && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          SPOTIFY_SP_DC: ${{ secrets.SPOTIFY_SP_DC }}
        run: |
          if [ -z "$SPOTIFY_SP_DC" ]; then
            echo 'Spotify folder filing is not configured (SPOTIFY_SP_DC is missing).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/file_spotify_playlists.py --apply --receipt verification/spotify-folder-filing.json
      - name: Save Spotify folder cooldown
        if: ${{ always() && !inputs.auth_check_only && hashFiles('spotify_cache/folder-cooldown.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: spotify_cache/folder-cooldown.json
          key: ${{ runner.os }}-spotify-folder-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export the complete catalog to the website
        id: website
        if: ${{ !cancelled() && !inputs.auth_check_only && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: python3 scripts/update_website.py
      - name: Persist catalog and publish the website
        id: persist
        if: ${{ !cancelled() && !inputs.auth_check_only && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          git config user.email 'action@github.com'
          git config user.name 'GitHub Action'
          git add data/catalog.json
          if [ '${{ steps.website.outcome }}' = success ]; then
            git add docs/index.html docs/playlists.jsonl docs/assets docs/archive
          fi
          if ! git diff --staged --quiet; then
            git commit -m 'Archive broadcasts and publish the catalog website'
          fi
          git push
      - name: Preserve recovery state
        if: ${{ always() && !inputs.auth_check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/catalog.json
            spotify_cache/track_cache.json
            verification/spotify-folder-filing.json
      - name: Report partial failures
        if: ${{ !cancelled() && !inputs.auth_check_only && steps.build.outcome == 'success' }}
        env:
          OUTCOMES: '${{ steps.archive.outcome }} ${{ steps.folders.outcome }} ${{ steps.website.outcome }} ${{ steps.persist.outcome }}'
        run: |
          echo "Archive, folder filing, website, persistence: $OUTCOMES" >> "$GITHUB_STEP_SUMMARY"
          for outcome in $OUTCOMES; do
            test "$outcome" = success || exit 1
          done
