name: Checks
on:
  pull_request:
    # The macOS companion is built and tested locally, independently of the scraper.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'Cargo.*'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'Cargo.*'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/companion/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test scripts/test_catalog_model.mjs
